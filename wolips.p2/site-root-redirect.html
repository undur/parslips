<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Parsley Template Editor</title>
		<!--
			The site is served from the p2 repository directory (repository/), so the
			bare Pages root would otherwise 404. CI copies this file to the served root
			(see .github/workflows/maven.yml) to forward visitors to the real site. The
			target is relative so it works regardless of the Pages base path.
		-->
		<meta http-equiv="refresh" content="0; url=repository/">
		<link rel="canonical" href="repository/">
		<script>location.replace("repository/");</script>
	</head>
	<body>
		<p>Redirecting to <a href="repository/">the Parsley Template Editor site</a>…</p>
	</body>
</html>
