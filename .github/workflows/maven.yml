name: Deploy p2 to pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml
    - name: Add site root redirect
      # GitHub Pages serves wolips.p2/target/, but the site (and the p2 update
      # site) live under repository/, so the bare root (/parslips/) 404s. Drop a
      # redirect at the served root so /parslips/ forwards to /parslips/repository/.
      # The target is relative, so it works regardless of the Pages base path.
      run: cp wolips.p2/site-root-redirect.html wolips.p2/target/index.html
    - name: Upload pages artifact
      id: deployment
      uses: actions/upload-pages-artifact@v3
      with:
        path: wolips.p2/target/

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
